# Web-server preset: deepest (DeepSeek + Tavily + local-embeddings flavor)
# Extended iterative walk; the heaviest budget.
Agent:
  name: CaesarExplorer
  draw_fsm: false

CaesarAgent:
  additional_starting_queries: 9
  max_web_searches: 30
  max_iterations: 1000
  save_graph_interval: 2

  use_quick_explore: False
  quick_explore_insights: False
  exploration_llm_config:
    model: deepseek-chat

  adapt_role: True

ArtifactSynthesizer:
  synthesis_iterations: 25
  synthesis_drafts: 3
  synthesis_merge_artifacts: true
  synthesis_eli5: false
  synthesis_eli5_length: [null, 450]
  synthesis_human_eval: false
  synthesis_max_length: null
  synthesis_iteration_filter: null
  # No image model on a DeepSeek-only deployment.
  synthesis_generate_images: 0

LLMHandler:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-chat
  # Deep research + synthesis calls need the extra headroom.
  timeout: 1200

AgentMemory:
  enabled: true
  use_graph: false

ChromaClientManager:
  model: deepseek-chat
  # Local, free, no-API-key embeddings (chroma bundled ONNX all-MiniLM-L6-v2).
  embedding_model: all-MiniLM-L6-v2

BraveSearch:
  # false → Tavily wins when TAVILY_API_KEY is set, then Brave, then DDGS.
  use_ddgs: False

Logger:
  include_caller_info: "rome"
  level: "info"
